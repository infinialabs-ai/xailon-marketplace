    content read scope)
notes: Figma's official remote server (https://mcp.figma.com/mcp) only accepts clients listed in Figma's
  MCP Catalog, so Xailon cannot use it unless listed. The official desktop server (http://127.0.0.1:3845/mcp)
  needs the Figma desktop app with Dev Mode. For both reasons this entry uses the most-used community
  server (Framelink, about 16k stars, actively maintained). Reviewer may swap in the official en
