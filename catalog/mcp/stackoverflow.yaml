notes: Hosted only, in beta, with OAuth through a Stack Exchange login on first use. Limited to 100 calls
  per day per user. The tools are so_search and get_content. The vendor docs configure it through npx
  mcp-remote mcp.stackoverflow.com rather than a direct http entry. The standard OAuth discovery documents
  (/.well-known/oauth-protected-resource and oauth-authorization-server) return 404 on mcp.stackov
