    license: MIT
    transport: stdio
    read_write: read-write
  alternatives:
  - CData Connect AI
  self_host: Run knakit/ifs-mcp-server-local locally with an IFS OAuth client.
  gap: There is no official server, and community options are small.
  packages: []
  verified: '2026-10-07'
- system: Infor (CloudSuite / M3 / LN)
  vendor: Infor
  segment: erp
  status: ga
  summary: Infor OS 2026.10 ION API Gateway can register and proxy MCP servers built by Infor teams, customers
    or third parties. Calls run as the user through OAuth 2.1, and admins create MCP Client authorized
    apps for external tools. The docs give no standard ERP endpoint shape.
  refs:
  - https://docs.infor.com/inforos/2026.10/en-us/useradminlib_cloud/apigatewayag_cloud/bzw1785134480799.html
  alternatives:
  - CData Connect AI
  - Makini
  self_host: Register an MCP server in ION API Gateway and create an authorized app for each external
    client.
  gap: There is no documented out-of-the-box ERP MCP endpoint, and clients must be pre-authorized as ION
    apps.
  packages: []
  verified: '2026-10-07'
- system: Microsoft Dynamics 365 Business Central
  vendor: Microsoft
  segment: erp
  status: ga
  summary: Business Central online includes a hosted MCP server at https://mcp.businesscentral.dynamics.com
    (streamable HTTP). You select the tenant, environment, company and configuration with the headers
    TenantId, EnvironmentName, Company and ConfigurationName. By default it gives read-only API discovery.
    Admins enable create, modify, delete and actions per API page in MCP Server Configurations, and data
    query tools are in preview. Auth is Microsoft Entra delegated (Financials.ReadWrite.All). Entra does
    not support DCR, so each MCP host needs a pre-registered Entra app client ID.
  refs:
  - https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/ai/mcp-overview
  - https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/ai/configure-mcp-server
  - https://learn.microsoft.com/en-us/dynamics365/business-central/dev-itpro/ai/use-mcp-server-non-microsoft
  open_source:
  - repo: https://github.com/SShadowS/business-central-mcp
    license: MIT
    transport: stdio
    read_write: read-write
  - repo: https://github.com/knowall-ai/mcp-business-central
    license: NOASSERTION
    transport: stdio
    read_write: read-write
  alternatives:
  - CData Connect AI
  self_host: For on-prem BC27/BC28 run `npx -y business-central-mcp@1.7.1` on a machine that can reach
    the BC web client, using a NavUserPassword service user. It can also be wrapped in a container next
    to the BC server tier.
  gap: The official server is online-only and needs your own Entra app registration (the business-central
    package signs in with it). On-premises has only the reverse-engineered community bridge.
  packages:
  - business-central
  - business-central-onprem
  verified: '2026-10-07'
- system: Microsoft Dynamics 365 Finance & Operations
  vendor: Microsoft
  segment: erp
  status: ga
  summary: The dynamic Dynamics 365 ERP MCP server (10.0.47, or 10.0.46 PQU-2 / 10.0.45 PQU-7, Tier 2+
    or UDE only) offers data, form and action tools with CRUD under the user's F&O roles. The static 13-tool
    server retires on 2026-10-01. Access is limited to Entra client IDs on the Allowed MCP clients list
    (by default Copilot Studio, VS Code, Microsoft Cowork and Finance Agent); other platforms need an
    Entra app registration that an admin allow-lists. Non-Copilot-Studio clients are billed 0.1 Copilot
    Credits per tool call unless the user holds Finance or SCM Premium.
  refs:
  - https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/copilot/copilot-mcp
  - https://learn.microsoft.com/en-us/dynamics365/fin-ops-core/dev-itpro/copilot/mcp/mcp-security
  - https://learn.microsoft.com/en-us/dynamics365/finance/business-performance-analytics/erp-analytics-mcp-overview
  alternatives:
  - CData Connect AI
  self_host: Not applicable. The server runs inside each F&O environment; customers register an Entra
    app for their client and add it under Allowed MCP clients.
  gap: Each client ID must be added to the environment's Allowed MCP clients list by an admin, and calls
    from clients other than Copilot Studio are billed per tool call.
  packages:
  - dynamics-finance-operations
  verified: '2026-10-07'
- system: Microsoft Dynamics GP
  vendor: Microsoft
  segment: erp
  status: none
  summary: Microsoft has no MCP server for Dynamics GP, and no maintained community server was found.
  refs: []
  alternatives:
  - CData Connect AI
  self_host: Not applicable.
  gap: No MCP server exists.
  packages: []
  verified: '2026-10-07'
- system: Odoo
  vendor: Odoo S.A.
  segment: erp
  status: ga
  summary: 'Odoo 20 includes an MCP server in the Odoo AI app at <database URL>/mcp. Auth is a static
    user API key generated with the MCP scope and sent as Authorization: Bearer; plain RPC keys are refused.
    By default it exposes three AI tools (get models, get fields, plus one more), and admins can expose
    more server actions as tools. It supports reads and writes under the user''s access rights.'
  refs:
  - https://www.odoo.com/documentation/20.0/applications/productivity/ai/mcp_server.html
  open_source:
  - repo: https://github.com/erpipe-org/mcp-odoo
    license: MIT
    transport: stdio
    read_write: read-write
  - repo: https://github.com/ivnvxd/mcp-server-odoo
    license: MPL-2.0
    transport: stdio
    read_write: read-write
  alternatives:
  - CData Connect AI
  self_host: For Odoo 16-19 run `uvx odoo-mcp==1.3.0` locally with a dedicated Odoo user and API key,
    or use the repo's Dockerfile to run it in a container close to the database.
  gap: The built-in server exists only on Odoo 20, and its default tool set is small until admins expose
    server actions. Older versions depend on the community bridge.
  packages:
  - odoo
  - odoo-legacy
  verified: '2026-10-07'
- system: Oracle Fusion Cloud ERP
  vendor: Oracle
  segment: erp
  status: ga
  summary: Fusion Applications 26A added MCP client support in AI Agent Studio, so Fusion agents can call
    external servers. Oracle Fusion Data Intelligence (FDI) offers an MCP server for analytics (semantic
    models, KPIs, workbooks, Logical SQL) with OAuth 2.0 through IDCS or IAM, not for transactional ERP.
  refs:
  - https://blogs.oracle.com/fusioninsider/what-you-need-to-know-about-mcp-a2a-in-fusion-apps
  - https://blogs.oracle.com/analytics/fusion-data-intelligencefdi-integrated-mcp-server
  - https://docs.oracle.com/en/cloud/saas/fusion-ai/aiaas/add-mcp-tool.html
  alternatives:
  - CData Connect AI
  self_host: Not applicable; use FDI for analytics, or Oracle Integration's MCP server capability for
    custom flows.
  gap: There is no official transactional Fusion ERP MCP server. FDI needs its own licence and gives read-only
    analytics.
  packages: []
  verified: '2026-10-07'
- system: Oracle NetSuite
  vendor: Oracle
  segment: erp
  status: ga
  summary: The NetSuite AI Connector Service exposes an account-specific streamable-HTTP MCP endpoint
    at https://<accountid>.suitetalk.api.netsuite.com/services/mcp/v1/all (or /suiteapp/<applicationid>).
    The MCP Standard Tools SuiteApp adds record create, read and update, reports, saved searches and read-only
    SuiteQL. Auth is OAuth 2.0 authorization code with PKCE. Integration records are created automatically
    on first connection for supported clients, and the Administrator role is not allowed.
  refs:
  - https://docs.oracle.com/en/cloud/saas/netsuite/ns-online-help/article_4160616848.html
  - https://docs.oracle.com/en/cloud/saas/netsuite/ns-online-help/section_0714082142.html
  - https://docs.oracle.com/en/cloud/saas/netsuite/ns-online-help/article_3200541651.html
  open_source:
  - repo: https://github.com/oracle-samples/netsuite-suitecloud-samples
    license: UPL-1.0
    transport: http
    read_write: read-write
  alternatives:
  - CData Connect AI
  self_host: Not needed; the official endpoint is hosted in each NetSuite account. To add custom tools,
    deploy an SDF custom-tool SuiteApp and use the /suiteapp/<applicationid> URL.
  gap: Writes are limited to records the role can edit, SuiteQL is read-only, reports take only date and
    subsidiary filters, there is no admin-role access, and clients that cannot complete automatic integration-record
    creation need a manually created integration record.
  packages:
  - netsuite
  verified: '2026-10-07'
