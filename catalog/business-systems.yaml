  - Apideck
  self_host: Use the official gateway; community options are small single-author projects.
  gap: The official server is read-only, limited to the listed regions, and has an unverified endpoint
    URL and client-registration model, so it was not packaged.
  packages: []
  verified: '2026-10-07'
- system: Sage X3
  vendor: Sage
  segment: erp
  status: preview
  summary: The Sage X3 MCP Server 1.0 is in Early Access through the Sage AI Gateway. Access is by registration;
