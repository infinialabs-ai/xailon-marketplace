# Which business systems have an MCP server, how to run one, and which marketplace
# packages cover them. Each fact is checked against the vendor's or project's own docs.
# status: ga | preview | sample | announced | none
systems:
- system: Acumatica
  vendor: Acumatica
  segment: erp
  status: ga
  summary: 'Acumatica 2026 R2 (GA 2026-10-01) adds MCP Connection: admins configure MCP servers that expose
    published Generic Inquiries as tools, giving Claude, ChatGPT, Gemini and other clients governed, read-only
    access under each user''s roles with field-level masking. A public endpoint URL format and OAuth client-registration
    details were not found in vendor docs as of the verification date.'
  refs:
  - https://www.acumatica.com/corporate-newsroom/press-releases/acumatica-2026-r2-release-with-embedded-ai/
  open_source:
  - repo: https://github.com/hallboys/MCP4Acumatica
    license: Apache-2.0
    transport: workers
    read_write: read-write
  alternatives:
  - CData Connect AI
  self_host: Deploy MCP4Acumatica to your own Cloudflare account (Workers paid plan for Durable Objects;
    a Deploy button or setup.sh creates the KV and R2 bindings) with a Connected Application in SM303010,
    then point clients at https://<worker-host>/mcp.
  gap: The official server is read-only and limited to Generic Inquiries, with no documented URL shape
    yet. Writes and pre-2026 R2 instances need a self-deployed community Worker.
  packages: []
  verified: '2026-10-07'
- system: Dolibarr
  vendor: Dolibarr
  segment: erp
  status: none
  summary: Dolibarr does not ship an MCP server.
  refs: []
  open_source:
  - repo: https://github.com/latinogino/dolibarr-mcp
    license: MIT
    transport: stdio
    read_write: read-write
  self_host: Run latinogino/dolibarr-mcp from source with a Dolibarr API key.
  gap: There is no official server, and the community option is minor.
  packages: []
  verified: '2026-10-07'
- system: Epicor Kinetic
  vendor: Epicor
  segment: erp
  status: announced
  summary: At Epicor Insights 2026 (May 2026) Epicor announced the Prism Agent Foundry and an open agentic
    ecosystem that includes MCP connectivity. No public MCP endpoint, auth model or setup documentation
    was found.
  refs:
  - https://www.epicor.com/en/newsroom/news-releases/epicor-introduces-agentic-ai-stack/
  open_source:
  - repo: https://github.com/acroston1/epicor-mcp-oss
    license: Apache-2.0
    transport: stdio
    read_write: read-only
  alternatives:
  - CData Connect AI
  - Cutova.ai
  self_host: Run epicor-mcp-oss on an internal server with a scoped Epicor service account and API key,
    and connect clients through its stdio bridge.
  gap: There is no official server yet, and the community option is read-only and unproven.
  packages: []
  verified: '2026-10-07'
- system: ERPNext / Frappe
  vendor: Frappe Technologies
  segment: erp
  status: none
  summary: Frappe ships frappe/mcp, an experimental library that lets Frappe apps expose streamable-HTTP
    MCP endpoints, but ERPNext has no built-in MCP server.
  refs:
  - https://github.com/frappe/mcp
  open_source:
  - repo: https://github.com/frappe/mcp
    license: MIT
    transport: http
    read_write: read-write
  - repo: https://github.com/buildswithpaul/Frappe_Assistant_Core
    license: AGPL-3.0
    transport: http
    read_write: read-write
  - repo: https://github.com/rakeshgangwar/erpnext-mcp-server
    license: MIT
    transport: stdio
    read_write: read-write
  alternatives:
  - CData Connect AI
  self_host: Install Frappe Assistant Core as a Frappe app on your own site (bench get-app / install-app)
    and connect over its OAuth MCP endpoint.
  gap: There is no official server, and the leading community app is AGPL, so nothing is packageable.
  packages: []
  verified: '2026-10-07'
- system: IFS Cloud
  vendor: IFS
  segment: erp
  status: none
  summary: IFS describes MCP servers in its strategy blog, but no published product MCP server was found.
  refs:
  - https://blog.ifs.com/context-engineering-from-erp-to-ai-and-the-future-of-work/
  open_source:
