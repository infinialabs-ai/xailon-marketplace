- system: QuickBooks Online
  vendor: Intuit
  segment: accounting
  status: ga
  summary: Intuit's hosted QuickBooks connector is GA inside Claude (connector directory) and ChatGPT,
    US customers only; it reads P&L, cash flow and benchmarks and writes invoices, estimates, customers,
    items and GL imports, with confirmation for destructive actions. The hosted endpoint is not documented
