- system: SAP Business One
  vendor: SAP
  segment: erp
  status: sample
  summary: From SAP Business One 10.0 FP 2608, SAP ships downloadable sample code for an MCP server that
    sits on the Service Layer. It speaks streamable HTTP, offers full CRUD with MCP-elicitation approval
    before writes, OAuth 2.0 bearer validation or a direct dev mode, and multi-company support through
    the SLD. It is sample code you host yourself, not a managed service.
  refs:
  - https://help.sap.com/docs/SAP_BUSINESS_ONE/bb89a9939c294f14a7f532f7e76ade9e/9bdaeca12a424e6f9e3a0f4354651829.html
  open_source:
  - repo: https://github.com/CDataSoftware/sap-business-one-mcp-server-by-cdata
    license: MIT
    transport: stdio
    read_write: read-only
  alternatives:
  - CompuTec AppEngine MCP Server (commercial)
  - CData Connect AI
  self_host: Download SAP's sample from SAP Help, run it next to the Service Layer (on-prem or partner
    cloud) behind HTTPS, and turn on its OAuth mode for production. Each team then points a remote MCP
    client at its own URL.
  gap: There is no SAP-hosted endpoint and no versioned package; the sample's licence terms are SAP sample-code
    terms rather than an OSI licence, so it cannot be redistributed as a plugin.
  packages: []
  verified: '2026-10-07'
- system: SAP S/4HANA and ECC
  vendor: SAP
  segment: erp
  status: ga
  summary: SAP Integration Suite's MCP Gateway (API Management plus an Integration Cell) turns APIs, iFlows
    and RFC connections into governed MCP servers on a customer-defined path. Productive use needs the
    Premium or Enhanced Edition, and the tutorial uses OAuth client-credentials bearer tokens. SAP API
    Policy v.4.2026a s.2.2.2 forbids using SAP APIs from (semi-)autonomous or generative AI systems except
    through SAP-endorsed pathways.
  refs:
  - https://developers.sap.com/tutorials/btp-integration-suite-mcp-gateway/
  - https://help.sap.com/doc/sap-api-policy/latest/en-US/API_Policy_latest.pdf
  open_source:
  - repo: https://github.com/oisee/odata_mcp_go
    license: MIT
    transport: stdio
    read_write: read-write
  - repo: https://github.com/lemaiwo/btp-sap-odata-to-mcp-server
    license: MIT
    transport: http
    read_write: read-write
  alternatives:
  - CData Connect AI
  self_host: Customers on BTP should expose published OData APIs through Integration Suite's MCP Gateway,
    which is the SAP-endorsed route. Teams without it can deploy lemaiwo/btp-sap-odata-to-mcp-server to
    Cloud Foundry with a BTP destination to S/4HANA, or run the odata_mcp_go binary on-prem in --read-only
    mode, at their own risk under the API Policy.
  gap: There is no standard SAP endpoint shape (each Integration Suite MCP server has its own host and
    path), and SAP API Policy v.4.2026a restricts non-SAP AI agents. Nothing can be packaged in a way
    that is reproducible and also compliant with the policy.
  packages: []
  verified: '2026-10-07'
