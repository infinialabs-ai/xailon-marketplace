  - name: "storyteller"
    path: ./presentation-designer/storyteller.yaml
    description: "Presentation storyteller. Defines the presentation's core message based on audience analysis, and designs its logical flow and emotional curve."
  - name: "visual_designer"
    path: ./presentation-designer/visual-designer.yaml
    description: "Visual designer. Designs the layout, colors, typography, and imagery of presentation slides, and produces a Markdown-based slide deck."
