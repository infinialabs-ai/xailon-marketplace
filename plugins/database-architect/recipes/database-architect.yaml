  - name: "integration_reviewer"
    path: ./database-architect/integration-reviewer.yaml
    description: "Integration Reviewer (QA). Cross-validates alignment across data model, migration, performance, and security artifacts, and evaluates operational readiness."
  - name: "performance_analyst"
    path: ./database-architect/performance-analyst.yaml
    description: "DB Performance Analyst. Designs index strategies, query optimization, execution plan (EXPLAIN) analysis, partitioning, connection pooling, and caching strategies."
  - name: "security_auditor"
    path: ./database-architect/security-auditor.yaml
    description: "DB Security Auditor. Verifies and designs access control (RBAC), data encryption (TDE, column-level encryption), SQL injection defense, audit logging, and backup/recovery strategies."
