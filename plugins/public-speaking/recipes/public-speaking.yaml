    description: "Public speaking audience analyst. Analyzes the target audience of a presentation, speech, or debate, and identifies the context, expectations, emotional state, and level of prior knowledge to lay the foundation for the content strategy."
  - name: "debate_preparer"
    path: ./public-speaking/debate-preparer.yaml
    description: "Debate preparation expert. Strengthens the presenter's arguments, builds defensive logic against expected counterarguments, and establishes an offensive cross-examination strategy."
  - name: "rehearsal_coach"
    path: ./public-speaking/rehearsal-coach.yaml
    description: "Rehearsal coach and cross-validation specialist (QA). Writes a rehearsal guide that improves delivery, and cross-validates consistency across the speech script, debate preparation, and Q&A."
  - name: "speech_writer"
    path: ./public-speaking/speech-writer.yaml
    description: "Public speaking speech/presentation writer. Writes persuasive, memorable speeches and presentation scripts based on audience analysis, using rhetorical techniques and storytelling."
