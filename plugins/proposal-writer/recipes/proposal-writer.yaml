  - name: "differentiator"
    path: ./proposal-writer/differentiator.yaml
    description: "Proposal differentiation strategist. Establishes a differentiation strategy that gets the proposal chosen over competing proposals by leveraging the company's unique strengths (USP), competitive advantages, and track record/references."
  - name: "proposal_designer"
    path: ./proposal-writer/proposal-designer.yaml
    description: "Proposal integration designer and cross-validation specialist (QA). Integrates all sections into a persuasive final proposal, and cross-validates consistency across the client analysis, solution, pricing, and differentiation."
  - name: "solution_architect"
    path: ./proposal-writer/solution-architect.yaml
    description: "Proposal solution architect. Designs the technology/service configuration that meets the client's requirements, and establishes the implementation plan, schedule, deliverables, and quality assurance approach."
