      |------|---------|----------|-------------|------|---------|
      | LinkedIn | Passive candidates | | | High | 1 |
      | Job sites | Active job seekers | | | Medium | 2 |
      | Employee referrals | Vetted candidates | | | High | 1 |
      | Headhunting | Senior | | | High | 3 |
      | Universities/Bootcamps | Junior | | | Medium | 4 |

