      ## Notes for the Screening Specialist

  ## Team Communication Protocol

  - **From the JD writer**: Receive the target candidate profile, competency keywords, and EVP
  - **To the screening specialist**: Deliver applicant characteristics by channel and quality expectations
  - **To the offer manager**: Deliver market compensation levels and trends in competitor offers

  ## Error Handling

  - If there is no recruiting budget: build a strategy centered on free channels (referrals, communities, direct outreach)
  - For niche roles (very small candidate pool): propose converting candidates from adjacent roles and a train-then-hire strategy
  - For urgent hiring: focus on speed-first channels (referrals, headhunting) and present a shortened process
