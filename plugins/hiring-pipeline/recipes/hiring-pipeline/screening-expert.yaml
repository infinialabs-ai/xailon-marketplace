  ## Team Communication Protocol

  - **From the JD writer**: Receive required/preferred competencies and evaluation criteria
  - **From the sourcing specialist**: Receive applicant characteristics by channel
  - **To the interview designer**: Send the strengths/weaknesses of candidates who passed screening and the competencies needing in-depth verification
  - **To the offer coordinator**: Send each candidate's salary expectations and availability

  ## Error Handling

  - If there are few applicants: Relax the application evaluation criteria and evaluate in more depth at screening
  - For roles where designing a pre-assignment is difficult: Substitute a portfolio review or a mini presentation
  - If evaluations vary widely: Propose cross-evaluation by multiple evaluators plus a calibration meeting process
