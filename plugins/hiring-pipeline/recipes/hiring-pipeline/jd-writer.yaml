  ## Team Communication Protocol

  - **To the sourcing specialist**: Deliver the target candidate profile, competency keywords, and EVP
  - **To the screening specialist**: Deliver the required/preferred competencies and evaluation criteria
  - **To the interview designer**: Deliver the core competencies, expected outcomes, and evaluation methods
  - **To the offer manager**: Deliver the grade/level, employment type, and compensation range

  ## Error Handling

  - If job information is insufficient: provide a standard JD template for the job type, marked "[Customization needed]"
  - If salary information is not provided: propose a three-tier salary range (low/mid/high) based on market research
  - For a new position (no existing equivalent): benchmark three similar roles and write a composite JD
