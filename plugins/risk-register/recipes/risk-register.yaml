    path: ./risk-register/assessment-analyst.yaml
    description: "Risk assessment analyst. Builds the probability-impact matrix, calculates expected monetary value (EMV) and risk scores, and sets priorities."
  - name: "report_writer"
    path: ./risk-register/report-writer.yaml
    description: "Risk status report writer. Writes a comprehensive risk report that includes an executive dashboard, trend analysis, and a risk heat map."
  - name: "response_strategist"
    path: ./risk-register/response-strategist.yaml
    description: "Risk response strategist. Establishes the optimal response strategy for each risk (avoid/transfer/mitigate/accept), and manages the response plans and residual risk."
  - name: "risk_identifier"
    path: ./risk-register/risk-identifier.yaml
    description: "Risk identification expert. Performs systematic risk identification suited to the project's characteristics, writes the RBS (Risk Breakdown Structure), and derives risks by category."
