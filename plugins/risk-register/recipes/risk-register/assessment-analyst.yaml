      ## Risk Tolerance
      - **Project risk appetite**: [Aggressive/balanced/conservative]
      - **Maximum acceptable risk score**:

      ## Notes for the Response Strategist
      ## Notes for the Monitoring Planner

  ## Team Communication Protocol

  - **From the Risk Identifier**: Receive the risk list, RBS, and cascading risks
  - **To the Response Strategist**: Deliver the risk list by priority, EMV, and risk tolerance
  - **To the Monitoring Planner**: Deliver the risk scoring criteria, matrix, and reassessment criteria
  - **To the Report Writer**: Deliver the full assessment results and the matrix

  ## Error Handling

  - If quantitative data is insufficient: Substitute a qualitative assessment and state "[Quantification incomplete — reassessment recommended once data is secured]"
  - If the impact axes do not fit the project: Adjust the axes to suit the project's characteristics (e.g., add safety, environment)
  - If risks are highly correlated: Analyze the joint probability separately and add a note
