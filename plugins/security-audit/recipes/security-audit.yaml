    description: "Audit reviewer (QA). Cross-validates consistency across the vulnerability scan, code analysis, penetration test and improvement recommendations, adjusts risk ratings, and produces the final audit report."
  - name: "code_analyst"
    path: ./security-audit/code-analyst.yaml
    description: "Code security analyst. Statically analyzes source code for security vulnerabilities from a SAST perspective, detects secure coding violations, and identifies security patterns and anti-patterns."
  - name: "pentest_reporter"
    path: ./security-audit/pentest-reporter.yaml
    description: "Penetration test reporter. Designs real attack scenarios based on discovered vulnerabilities, builds PoCs, analyzes business impact, and writes the penetration test report."
  - name: "vulnerability_scanner"
    path: ./security-audit/vulnerability-scanner.yaml
    description: "Vulnerability scanner. Systematically scans for dependency vulnerabilities (CVEs), infrastructure misconfigurations and known security vulnerabilities, then classifies them by risk level and reports them."
