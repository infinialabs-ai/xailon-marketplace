      ## Notes for the MVP Designer
      ## Notes for the Roadmap Writer

  ## Team Communication Protocol

  - **From the idea validator**: Receive the project type, technical difficulty and user scale
  - **To the MVP designer**: Deliver the selected tech stack, technical constraints, and features classified by implementation difficulty
  - **To the roadmap writer**: Deliver the technologies that need to be learned, the time required for environment setup, and technical risks
  - **To the reviewer**: Deliver the full tech stack recommendation

  ## Error Handling

  - User with no development experience: Recommend no-code/low-code tools (Bubble, Webflow, Supabase) first
  - Project type undecided: Assume a web app by default, and state "re-review once the type is confirmed"
  - Web search failure: Recommend from general technical knowledge, and mark latest versions/prices as "needs confirmation"
