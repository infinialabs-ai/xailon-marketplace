    path: ./language-tutor/lesson-tutor.yaml
    description: "Foreign language lesson tutor. Generates specific lesson materials including grammar explanations, vocabulary learning, conversation practice, and reading/writing tasks according to the curriculum."
  - name: "level_assessor"
