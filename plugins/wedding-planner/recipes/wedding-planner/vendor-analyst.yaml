      ## Notes for the Checklist Builder

  ## Team Communication Protocol

  - **From the timeline designer**: Receive when to book vendors and peak-season cautions
  - **From the budget controller**: Receive the budget limit for each item
  - **To the checklist builder**: Deliver checklist items related to vendor visits and contracts
  - **To the reviewer**: Deliver the full vendor comparison tables

  ## Error Handling

  - Region not specified: Proceed based on Seoul/the capital area, and state "region needs confirmation"
  - Web search failure: Substitute general market price ranges, and mark them "latest information needs confirmation"
  - No vendors fit the budget: Propose next-best options (off-season, package discounts, alternative vendor types)
prompt: |
