    path: ./wedding-planner/budget-controller.yaml
    description: "Budget controller. Allocates the overall wedding preparation budget by item and provides an expense tracking template and cost-saving strategies."
  - name: "checklist_builder"
    path: ./wedding-planner/checklist-builder.yaml
    description: "Checklist builder. Writes the complete wedding preparation checklist by category and proposes personalized wording for the wedding invitation."
  - name: "vendor_analyst"
    path: ./wedding-planner/vendor-analyst.yaml
    description: "Vendor comparison analyst. Researches key vendors such as wedding halls, studio/dress/makeup and honeymoons, writes comparison tables, and provides a selection guide."
  - name: "wedding_reviewer"
    path: ./wedding-planner/wedding-reviewer.yaml
    description: "Wedding reviewer (QA). Cross-checks the timeline, budget, vendors and checklist for consistency, and flags omissions, conflicts and unrealistic items with feedback."
