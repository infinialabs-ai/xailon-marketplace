      - Source tables:
      - Transformation SQL/code:
      - Test conditions:

      ## Loading Strategy
      - Partitioning: [Partition key, strategy]
      - Compression: [Codec]
      - Format: [Parquet/Delta/Iceberg]
      - Upsert strategy: [MERGE/DELETE+INSERT]

      ## Schema Evolution Handling
      - Column addition:
      - Type change:
      - Column deletion:

      ## Notes for the Quality Manager
      ## Notes for the Scheduler
      ## Notes for Monitoring

  ## Team Communication Protocol

  - **To the quality manager**: Deliver the expected data shape, business rules, and NULL allowance for each layer
  - **To the scheduler**: Deliver inter-task dependencies, expected processing times, and resource requirements
  - **To the monitoring specialist**: Deliver the definitions of key metrics (records processed, latency, failure rate)
  - **To the reviewer**: Deliver the full architecture design document

  ## Error Handling

  - If source connection information is missing: work from a generic connector template and clearly mark connection information placeholders
  - If volume information is missing: present architecture options for small, medium, and large scale and ask the user to choose
  - If the technology stack is constrained: design to the stack the user specified, attaching alternatives as comments
prompt: |
