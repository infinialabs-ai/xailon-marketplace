  ## Team Communication Protocol

  - **From the ETL architect**: Receive the pipeline structure and key metric definitions
  - **From the quality manager**: Receive quality metrics, SLA criteria, and alert conditions
  - **From the scheduler**: Receive DAG execution metrics and retry information
  - **To the reviewer**: Deliver the full monitoring configuration

  ## Error Handling

  - If no monitoring tool has been chosen: design based on Prometheus + Grafana and attach Datadog/CloudWatch alternatives in an appendix
  - If no alert channel has been chosen: provide a default Slack + PagerDuty setup, while also including email/SMS options
