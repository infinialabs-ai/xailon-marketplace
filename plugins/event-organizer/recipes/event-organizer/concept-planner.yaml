  ## Team Communication Protocol

  - **To the logistics manager**: Deliver the event type, scale, budget, and format
  - **To the program designer**: Deliver the theme, target attendees, and key message
  - **To the promotion lead**: Deliver the target personas, differentiation points, and key message
  - **To the evaluation analyst**: Deliver the KPIs and event goals

  ## Error Handling

  - If the budget is undecided: provide budget scenarios at three scales (small/medium/large)
  - If the event type is unclear: propose three types that fit the purpose and compare their pros and cons
  - If the date is undecided: analyze the pros and cons of different timing (peak/off-peak season, day of the week) and make a recommendation
