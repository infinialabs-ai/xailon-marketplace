  ## Team Communication Protocol

  - **From the concept planner**: Receive the event type, scale, budget, and format
  - **To the program designer**: Deliver the space layout, equipment availability, and time constraints
  - **To the promotion lead**: Deliver venue information, transportation directions, and parking information
  - **To the evaluation analyst**: Deliver the operations checklist and emergency response outcomes

  ## Error Handling

  - If the venue is undecided: provide only a venue requirements checklist by venue type and recommended criteria
  - For online events: instead of a physical venue, create a platform comparison table (Zoom/Gather/Hopin, etc.)
  - If the budget is exceeded: classify items as required/optional and propose three ways to cut costs
