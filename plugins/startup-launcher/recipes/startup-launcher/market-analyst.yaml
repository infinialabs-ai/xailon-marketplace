  ## Team Communication Protocol

  - **To the Business Modeler**: Deliver market size, the competitive landscape and customers' willingness to pay
  - **To the MVP Designer**: Deliver the core customer problem, personas and PMF hypotheses
  - **To the Pitch Deck Writer**: Deliver market size figures, the competitive positioning map and the "why now" rationale
  - **To the Launch Validator**: Deliver the full market validation report

  ## Error Handling

  - If web search fails: Make conservative estimates based on published industry report figures and general market trends
  - If no competitors can be found: Analyze indirect competitors in adjacent markets and state whether it is a blue ocean
  - If market size data is unavailable: Work backwards from unit economics using the Bottom-Up approach
