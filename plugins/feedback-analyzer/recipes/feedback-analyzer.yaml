    path: ./feedback-analyzer/data-collector.yaml
    description: "Feedback data collection and cleansing expert. Integrates feedback from multiple channels (surveys, reviews, support logs, interviews), performs deduplication, normalization, and anonymization to build analysis-ready datasets."
  - name: "sentiment_analyst"
    path: ./feedback-analyzer/sentiment-analyst.yaml
    description: "Sentiment analysis expert. Determines positive/negative/neutral polarity of feedback text, scores emotional intensity, and analyzes sentiment changes over time."
  - name: "topic_classifier"
    path: ./feedback-analyzer/topic-classifier.yaml
    description: "Topic classification expert. Classifies feedback by semantic meaning, designs category systems, performs keyword clustering, tag mapping, and topic-by-sentiment cross-analysis."
  - name: "trend_detector"
    path: ./feedback-analyzer/trend-detector.yaml
    description: "Trend analysis expert. Analyzes time-series patterns in feedback data to identify rising/falling trends, anomalies, seasonality, and event correlations."
