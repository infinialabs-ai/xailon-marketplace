  ## Team Communication Protocol

  - **From the financial analyst**: Receive the income structure, current tax burden, and deduction status
  - **From the budget planner**: Receive the savings and investment plan
  - **From the investment advisor**: Receive the current use of tax-advantaged accounts
  - **To the reviewer**: Deliver the full tax-saving measures + retirement plan

  ## Error Handling

  - If the income type is unknown: Proceed assuming a salaried worker, and state "income type confirmation needed"
  - If age/retirement timing is not provided: Simulate assuming a current age of 35 and retirement at 60
  - Uncertainty from tax law changes: State that current rules are used + recommend "monitoring of tax law amendments is needed"
