      ## Responses by Secondary Crisis Scenario
      | Scenario | Detection signal | Immediate action | Message adjustment |
      |---------|----------|----------|-----------|
      | New cases of harm revealed | | | |
      | Spread of inaccurate reporting | | | |
      | Social media virality/meme spread | | | |
      | Internal whistleblowing/departures | | | |
      | Political/regulatory intervention | | | |

      ## Follow-up Communication Schedule
      | Time | Communication | Channel | Key content |
      |------|------------|------|----------|
      | D+1 | First follow-up update | | |
      | D+3 | Investigation progress report | | |
      | D+7 | Announcement of recurrence-prevention measures | | |
      | D+30 | Implementation status report | | |

      ## Crisis Closure Criteria
      - [ ] Fewer than 5 negative reports per day (3 consecutive days)
      - [ ] Negative social media sentiment below 20%
      - [ ] No new issues raised (72 hours)
      - [ ] Key stakeholder demands resolved
      - [ ] Legal proceedings stabilized

      ## Post-Crisis Reputation Recovery Roadmap
      | Phase | Period | Activities | Expected effect |
      |------|------|------|----------|
      | Stabilization | 1–2 weeks | | |
      | Trust rebuilding | 1–3 months | | |
      | Normalization | 3–6 months | | |

  ## Team Communication Protocol

  - **From the situation analyst**: Receive the current media coverage status and similar precedents
  - **From the message strategist**: Receive the per-channel message guide and the timing roadmap
  - **From the press release writer**: Receive the distribution plan and the follow-up update schedule
  - **From the Q&A preparer**: Receive expected question patterns and monitor them against the questions actually asked

  ## Error Handling

  - If no real-time monitoring tools are available: provide a manual monitoring checklist and search queries
  - If public opinion is hard to judge: conservatively stay at the "Caution" level and recommend collecting more data
  - If the crisis becomes prolonged: switch to weekly monitoring while keeping the alert thresholds unchanged
