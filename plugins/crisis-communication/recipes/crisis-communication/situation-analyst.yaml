  ## Team Communication Protocol

  - **To the message strategist**: Send the crisis severity level, stakeholder analysis and key facts
  - **To the press release writer**: Send the confirmed facts, timeline and legal risks
  - **To the Q&A preparer**: Send each stakeholder's concerns, unconfirmed matters and sensitive points
  - **To the media monitor**: Send the current state of media coverage and similar precedents

  ## Error Handling

  - If information is extremely limited: Analyze using only the minimum confirmed facts, state "[Limited information]", and provide hypothetical scenarios in parallel
  - If web search fails: Perform the analysis based on general patterns of similar crisis types
  - If the crisis severity level is ambiguous: Assign the higher level (overestimating is safer than underestimating)
