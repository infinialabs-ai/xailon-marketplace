      1. **Concern (empathy)**:
      2. **Commitment (promise)**:
      3. **Control (response)**:

      ## No-Go Phrases (Prohibited Expressions)
      | Prohibited expression | Reason | Alternative expression |
      |----------|------|----------|

      ## Per-Stakeholder Messages
      | Stakeholder | Channel | Core message | Tone | Timing |
      |-----------|------|-----------|-----|--------|

