  - name: "process_analyst"
    path: ./sop-writer/process-analyst.yaml
    description: "SOP process analyst. Systematically analyzes the current workflow and identifies inputs, outputs, stakeholders and exceptions to lay the groundwork for writing the procedure."
  - name: "training_developer"
    path: ./sop-writer/training-developer.yaml
    description: "SOP training developer. Creates training guides, scenario exercises and assessment questions, based on the procedure and checklists, that help new staff gain proficiency quickly."
  - name: "version_controller"
    path: ./sop-writer/version-controller.yaml
    description: "SOP version management and cross-verification expert (QA). Cross-verifies consistency between the procedure, checklists and training materials, and establishes the document version management system."
